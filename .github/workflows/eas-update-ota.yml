name: EAS Update — OTA                                                        
                                                                              
  on:                                    
    push:
      branches: [main]
      paths:                                                                    
        - "mobile/app/**"
        - "mobile/components/**"                                                
        - "mobile/lib/**"                                                     
        - "mobile/constants/**"                                                 
        - "mobile/assets/**"
    workflow_dispatch:                                                          
      inputs:                                                                   
        message:                         
          description: "Update message (defaults to commit subject)"            
          required: false                                                       
          type: string                   
                                                                                
  jobs:                                                                       
    publish:                             
      name: Publish OTA update
      runs-on: ubuntu-latest
      defaults:                                                                 
        run:
          working-directory: mobile                                             
      steps:                                                                  
        - name: Checkout                 
          uses: actions/checkout@v4
          with:                                                                 
            fetch-depth: 1
                                                                                
        - name: Use Node 22                                                   
          uses: actions/setup-node@v4    
          with:                                                                 
            node-version: "22"
            cache: npm                                                          
            cache-dependency-path: mobile/package-lock.json                   
                                                                                
        - name: Install dependencies
          run: npm ci                                                           
                                                                              
        - name: Setup EAS                
          uses: expo/expo-github-action@v8
          with:                                                                 
            eas-version: latest
            token: ${{ secrets.EXPO_TOKEN }}                                    
                                                                                
        - name: Resolve message          
          id: msg                                                               
          env:                                                                
            DISPATCH_MESSAGE: ${{ inputs.message }}
          run: |                                                                
            if [ -n "$DISPATCH_MESSAGE" ]; then
              MSG="$DISPATCH_MESSAGE"                                           
            else                                                              
              MSG=$(git log -1 --pretty=%s | head -c 100)                       
            fi                                                                  
            MSG=$(printf '%s' "$MSG" | tr -d '`$\\')
            {                                                                   
              echo "msg<<EOF"                                                 
              echo "$MSG"                                                       
              echo "EOF"                                                      
            } >> "$GITHUB_OUTPUT"        
                                                                                
        - name: Publish update
          env:                                                                  
            UPDATE_MSG: ${{ steps.msg.outputs.msg }}                          
          run: npx eas-cli update --branch production --message "$UPDATE_MSG"   
  --non-interactive
