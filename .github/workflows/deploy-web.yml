name: Deploy Web — Cloudflare Workers                                           
                                                                                  
  on:                         
    push:                                                                         
      branches: [main]                                                          
      paths:                  
        - "app/**"
        - "components/**"
        - "lib/**"
        - "public/**"
        - "middleware.ts"
        - "next.config.ts"                                                        
        - "open-next.config.ts"
        - "wrangler.toml"                                                         
        - "package.json"                                                        
        - "package-lock.json" 
        - "postcss.config.mjs"                                                    
        - "tsconfig.json"
    workflow_dispatch:                                                            
                                                                                
  jobs:                       
    deploy:
      name: Build & deploy
      runs-on: ubuntu-latest
      steps:                                                                      
        - name: Checkout
          uses: actions/checkout@v4                                               
          with:                                                                 
            fetch-depth: 1    

        - name: Use Node 22                                                       
          uses: actions/setup-node@v4
          with:                                                                   
            node-version: "22"                                                  
            cache: npm        
            cache-dependency-path: package-lock.json

        - name: Install dependencies
          run: npm ci
                                                                                  
        - name: Build (OpenNext)
          run: npx opennextjs-cloudflare build                                    
                                                                                
        - name: Deploy (Wrangler)
          env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}           
          run: npx wrangler deploy
