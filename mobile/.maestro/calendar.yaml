appId: com.grayyachts.marinetech
---
- launchApp
- tapOn: "Calendar"
- assertVisible: "Calendar"
- assertVisible:
    id: "calendar-screen"
    optional: true

# Day view + HourGrid
- tapOn:
    id: "view-toggle-day"
- assertVisible:
    id: "hour-grid"

# Empty-slot tap opens the full Service form (New Job) with start prefilled
- tapOn:
    id: "empty-slot-9"
- assertVisible: "New Job"

# Back to the Calendar tab, switch to Week
- tapOn: "Calendar"
- tapOn:
    id: "view-toggle-week"

- back
